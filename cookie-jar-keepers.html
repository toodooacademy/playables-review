<script>
/* Celebrate: level-complete reward overlay (ribbon, sunburst, count-up, confetti, CLAIM -> fly-to-pill). Self-contained, no assets. */
const Celebrate=(()=>{const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
 const css=`.cel{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(10,8,40,.9);overflow:hidden;font-family:system-ui,sans-serif;animation:celIn .25s ease-out}

@media (prefers-reduced-motion: reduce){.cel,.cel *{animation:none!important}.celFly{transition:none}}`;
 const PAL=[['#ff6fae','#e8337f','#a3165a'],['#5ee0ff','#1e9be8','#0d5a9c'],['#8dff7a','#2cc84a','#137a2a'],['#ffd84d','#ff9f1a','#b35c00'],['#c99bff','#8a4dff','#4f1fb0'],['#ff8f6b','#ff4d3d','#a3221a'],['#6effd6','#14c4a0','#0a7560']];

 function confetti(cv,emojis,pal){const ctx=cv.getContext('2d');let W,H;const fit=()=>{const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)};fit();
  const cols=[...pal,'#fff36b','#ffffff','#6bf0ff'];const P=[];const add=(n,burst)=>{for(let i=0;i<n;i++){const e=Math.random()<.45&&emojis.length;P.push({x:burst?W/2:Math.random()*W,y:burst?H*.38:-20-Math.random()*H*.5,vx:burst?(Math.random()-.5)*12:(Math.random()-.5)*1.5,vy:burst?-Math.random()*11-3:Math.random()*2+1,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:e?18+Math.random()*12:6+Math.random()*6,e:e?emojis[i%emojis.length]:null,c:cols[i%cols.length],sh:i%3})}};
  add(90,1);add(60,0);let run=true,t=0;const step=()=>{if(!run)return;t++;ctx.clearRect(0,0,W,H);for(const p of P){p.vy=Math.min(p.vy+.18,3.2);p.vx*=.985;p.x+=p.vx+Math.sin((t+p.s*9)/20)*.6;p.y+=p.vy;p.r+=p.vr;if(p.y>H+30&&t<420){p.y=-20;p.x=Math.random()*W;p.vy=1+Math.random()*2;p.vx=0}
   ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);if(p.e){ctx.font=p.s+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.e,0,0)}else{ctx.fillStyle=p.c;if(p.sh===0)ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else if(p.sh===1){ctx.beginPath();ctx.arc(0,0,p.s/2.4,0,7);ctx.fill()}else{ctx.beginPath();ctx.moveTo(0,-p.s/2);ctx.lineTo(p.s/2,p.s/2);ctx.lineTo(-p.s/2,p.s/2);ctx.fill()}}ctx.restore()}
   if(P.every(p=>p.y>H+30))run=false;else requestAnimationFrame(step)};requestAnimationFrame(step);return()=>{run=false}}

 /* opts: {reward, stars(1-3), bank, key(theme seed), emojis(string|array), title, phrase, claimText, mute, onClaim(newBank), details:{text,fn}} */
 function show(o){close();if(!document.getElementById('celCss')){const s=document.createElement('style');s.id='celCss';s.textContent=css;document.head.appendChild(s)}

  const ph=o.phrase||[['LEVEL COMPLETE','WELL DONE!','NICE ONE!'],['AWESOME!','GREAT JOB!','FANTASTIC!'],['SUPERSTAR!','PERFECT!','LEGENDARY!']][st-1][hash((o.key||'')+o.reward)%3];
  const em=[...new Set(Array.isArray(o.emojis)?o.emojis:emo(o.emojis))].slice(0,8);if(!em.length)em.push('⭐');em.push('⭐','🌟');
  const el=document.createElement('div');el.className='cel';el.id='celebrate';el.setAttribute('role','dialog');el.setAttribute('aria-label',ph);el.style.cssText=`--c1:${pal[0]};--c2:${pal[1]};--c3:${pal[2]}`;
  el.innerHTML=`<canvas class="celCf"></canvas><div class="celPill" aria-label="Total stars"><i>🌟</i><b class="celBank">${o.bank|0}</b></div>
  <div class="celBox"><div class="celRib">${ph}</div><div class="celStars">${[0,1,2].map(i=>`<span class="${i<st?'':'off'}" style="animation-delay:${.35+i*.18}s">⭐</span>`).join('')}</div>
  <div class="celSub">${o.title||'YOUR REWARD'}</div>${o.sub?`<div class="celGame">${o.sub}</div>`:''}
  <div class="celRew"><div class="celRays"></div><div class="celGlow"></div><div class="celNum"><i class="celIc">⭐</i><b class="celAmt">0</b></div></div>
  <button class="celClaim">${o.claimText||'CLAIM'}</button>${o.details?`<button class="celLink">${o.details.text}</button>`:''}</div>`;
  document.body.appendChild(el);const stop=RM()?()=>{}:confetti(el.querySelector('canvas'),em,pal);fanfare(st,o.mute);
  setTimeout(()=>count(el.querySelector('.celAmt'),0,o.reward|0,900),RM()?0:450);
  cur={el,stop};const claim=el.querySelector('.celClaim');let claimed=false;
  claim.onclick=()=>{if(claimed)return;claimed=true;claim.disabled=true;const pill=el.querySelector('.celPill'),bankEl=el.querySelector('.celBank'),src=el.querySelector('.celIc').getBoundingClientRect(),dst=pill.getBoundingClientRect();
   const nb=(o.bank|0)+(o.reward|0);const fin=()=>{count(bankEl,o.bank|0,nb,RM()?0:500,()=>{pill.classList.add('bump');setTimeout(()=>{const cb=o.onClaim;close();cb&&cb(nb)},RM()?150:550)})};
   if(RM()){fin();return}const N=Math.min(10,3+st*2);for(let i=0;i<N;i++){const f=document.createElement('div');f.className='celFly';f.textContent='⭐';f.style.left=(src.left+src.width/2-14+(Math.random()-.5)*60)+'px';f.style.top=(src.top+src.height/2-14+(Math.random()-.5)*40)+'px';document.body.appendChild(f);
    setTimeout(()=>{f.style.transform=`translate(${dst.left+16-parseFloat(f.style.left)}px,${dst.top+4-parseFloat(f.style.top)}px) scale(.6)`;f.style.opacity='.4';tone(900+i*60,.06,'sine',o.mute)},40+i*60);setTimeout(()=>f.remove(),900+i*60)}setTimeout(fin,650+N*60)};
  if(o.details)el.querySelector('.celLink').onclick=()=>{close();o.details.fn&&o.details.fn()};return el}

 return{show,close,on:()=>!!cur,PAL,emo}})();

</script><script>
/* ===== Shared shell: loop, input, audio, tutorial, levels, stars ===== */
const S=(()=>{const KEY='pgv_v40cookie_';const ls={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}};
 const cv=document.getElementById('c'),ctx=cv.getContext('2d');const S={W:360,H:620,ctx,ls,lv:0,t:0,done:false,mute:ls.get('mute',false),best:ls.get('best',{}),bank:ls.get('bank',0)};
 let sc=1,ox=0,oy=0,cw=0,ch=0;
 function fit(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cw=r.width;ch=r.height;cv.width=cw*d;cv.height=ch*d;sc=Math.min(cw/S.W,ch/S.H);ox=(cw-S.W*sc)/2;oy=(ch-S.H*sc)/2;S.dpr=d;S.cw=cw;S.ch=ch;S.sc=sc;S.ox=ox;S.oy=oy}
 addEventListener('resize',fit);
 S.toWorld=(cx,cy)=>{const r=cv.getBoundingClientRect();return[(cx-r.left-ox)/sc,(cy-r.top-oy)/sc]};
 S.toScreen=(x,y)=>{const r=cv.getBoundingClientRect();return[r.left+ox+x*sc,r.top+oy+y*sc]};
 /* audio */
 S.ac=null;S.master=null;S.audio=()=>{if(!S.ac){try{S.ac=new(window.AudioContext||window.webkitAudioContext)();S.master=S.ac.createGain();S.master.gain.value=S.mute?0:1;S.master.connect(S.ac.destination)}catch(e){}}if(S.ac&&S.ac.state==='suspended')S.ac.resume();return S.ac};
 S.sfx=(f,d=.15,type='sine',vol=.15,at=0,f2)=>{if(S.mute)return;const A=S.audio();if(!A)return;try{const o=A.createOscillator(),g=A.createGain(),t0=A.currentTime+at;o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.0005,t0+d);o.connect(g);g.connect(S.master);o.start(t0);o.stop(t0+d+.05)}catch(e){}};
 S.noise=(d=.1,vol=.1,at=0,hp=1000)=>{if(S.mute)return;const A=S.audio();if(!A)return;try{const b=A.createBuffer(1,A.sampleRate*d,A.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=A.createBufferSource(),g=A.createGain(),f=A.createBiquadFilter();f.type='highpass';f.frequency.value=hp;s.buffer=b;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(S.master);s.start(A.currentTime+at)}catch(e){}};
 const bM=document.getElementById('bMute');const setM=()=>{bM.textContent=S.mute?'🔇':'🔊';if(S.master)S.master.gain.value=S.mute?0:1};setM();
 bM.onclick=()=>{S.mute=!S.mute;ls.set('mute',S.mute);setM();S.audio()};
 /* original procedural music loop (WebAudio, on-device). Seeded per game; on/off saved. */
 S.music=ls.get('music',true);const bMu=document.getElementById('bMus');
 const setMu=()=>{bMu.textContent=S.music?'🎵':'🎵';bMu.style.opacity=S.music?1:.45;bMu.style.textDecoration=S.music?'':'line-through';bMu.setAttribute('aria-pressed',S.music)};setMu();
 bMu.onclick=()=>{S.music=!S.music;ls.set('music',S.music);setMu();S.audio();S.toast(S.music?'Music on 🎵':'Music off',900)};
 (()=>{const id='v40cookie';if(id==='beat'){bMu.style.display='none';return}let h=7;for(const ch of id)h=(h*31+ch.charCodeAt(0))%100003;const r=()=>(h=(h*16807)%2147483647)/2147483647;
  const roots=[196,220,247,262,294],root=roots[Math.floor(r()*5)],bpm=84+Math.floor(r()*30),spb=60/bpm/2,scale=[0,2,4,7,9,12,14,16];
  const mel=[],bass=[0,5,3,4].map(k=>[0,-5,-3,-7,2][Math.floor(r()*5)]*0+[0,7,9,5][k%4]);for(let i=0;i<32;i++)mel.push(r()<.7?scale[Math.floor(r()*scale.length)]:null);
  const note=(f,t,d,type,v)=>{const A=S.ac;const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0003,t+d);o.connect(g);g.connect(S.master);o.start(t);o.stop(t+d+.05)};
  let nx=0,i=0;setInterval(()=>{const A=S.ac;if(!A||A.state!=='running'||!S.music||S.mute||document.hidden){nx=0;return}if(!nx||nx<A.currentTime)nx=A.currentTime+.05;

 function spawn(){const k=spawnQ.shift(),d=CR[k],pi=Math.floor(rn()*paths.length);const hp=Math.ceil(d.hp*(1+(C.hp-1)*Math.min(1,wave/2))*(1+wave*.18));crit.push({k,d,pi,s:0,hp,mhp:hp,slow:0,home:0,sp:d.sp*(1+lv*.025),wob:rn()*6})}

 function act(x,y){
  if(menu){for(const o of menu.opts)if(K.d(x,y,o.x,o.y)<26){doOpt(o);return}menu=null;}
  if(phase==='break'&&K.d(x,y,300,592)<34){startWave();return}
  for(const p of pads)if(K.d(x,y,p.x,p.y)<28){openMenu(p);return}}
 function openMenu(p){S.sfx(600,.06,'sine',.08);let opts;if(!p.t){opts=TW.map((t,i)=>({t,i,cost:t.c}))}else opts=[{up:1,cost:p.t.lv>=3?0:upCost(p.t)}];
  const n=opts.length,oy=p.y<150?p.y+56:p.y-56;const x0=K.cl(p.x-(n-1)*33,32,328-(n-1)*66);opts.forEach((o,i)=>{o.x=x0+i*66;o.y=oy});menu={p,opts}}
 function doOpt(o){const p=menu.p;if(o.up&&p.t.lv>=3){S.toast('Already super! ⭐',900);menu=null;return}
  if(acorns<o.cost){S.toast('You have '+acorns+' 🌰, it needs '+o.cost+' 🌰. Send critters home for more!',1700);S.sfx(200,.12,'triangle',.06);return}
  acorns-=o.cost;if(o.up){p.t.lv++;S.toast('Level '+p.t.lv+'! '+acorns+' 🌰 left',1000)}else{p.t={def:o.t,lv:1,cd:0,face:0};S.toast(o.cost+' 🌰 spent · '+acorns+' 🌰 left',1000)}
  S.burst(p.x,p.y,14,['#ffd54a','#fff','#9f9'],3);S.sfx(660,.1,'triangle',.12);S.sfx(990,.14,'triangle',.12,.08);menu=null}
 function acornRow(n,x,y,max=10,sz=11){const k=Math.min(n,max),w=(k-1)*sz;for(let i=0;i<k;i++)S.emoji('🌰',x-w/2+i*sz,y,sz+2);if(n>max)K.txt('+'+(n-max),x+w/2+14,y,11)}
 const G={levels:LV.length,emojis:'🍪🌰⭐🐜',
  init(l){lv=l;C=LV[l];rn=K.rng(77+l*29);paths=C.p.map(catmull);makePads();towers=[];crit=[];shots=[];floaters=[];acorns=14;cookies=5;home=0;wave=0;phase='break';cnt=600;menu=null;f=0;dn=null},
  goal(){return{x:JX,y:JY,r:26}},phase(){return phase},_d(){return{pads:pads.length,built:pads.filter(p=>p.t).map(p=>p.t.def.k+p.t.lv),acorns,cookies,phase}},
  keys(){return[['goal',JX,JY,52,1]].concat(pads.slice(0,3).map(p=>['pad',p.x,p.y,48,0]))},
  step(){if(S.done)return;f++;if(K.bot())G.bot();
   for(const fl of floaters)fl.t++;floaters=floaters.filter(x=>x.t<50);
   if(phase==='break'){if(--cnt<=0)startWave();return}
   if(spawnQ.length&&--spawnT<=0){spawn();spawnT=Math.max(24,60-wave*4-lv*3)}
   for(const o of crit){if(o.hit)o.hit--;if(o.home){o.s-=1.2;o.fade=(o.fade||0)+.012;continue}const sp=o.sp*(o.slow>0?.45:1);if(o.slow>0)o.slow--;o.s+=sp*2;
    if(o.s/3>=paths[o.pi].length-1){o.gone=1;cookies-=o.k===3?3:1;S.sfx(250,.2,'square',.06,0,150);S.toast('A critter grabbed a cookie! 🍪',900)}}
   for(const p of pads){const t=p.t;if(!t)continue;if(--t.cd>0)continue;const rg=t.def.rg+(t.lv-1)*10;let tg=null,bs=-1;for(const o of crit){if(o.home||o.gone)continue;const[x,y]=pos(o);if(K.d(x,y,p.x,p.y)<rg&&o.s>bs){bs=o.s;tg=o}}
    if(tg){t.cd=t.def.rate;const[x,y]=pos(tg);t.face=Math.atan2(y-p.y,x-p.x);shots.push({x:p.x,y:p.y,tg,t:t.def,lv:t.lv});S.sfx(t.def.k==='tickle'?1200:t.def.k==='bubble'?500:300,.05,'sine',.04,0,t.def.k==='bubble'?900:600)}else t.cd=5}
   for(const s of shots){const[x,y]=pos(s.tg);const d=K.d(s.x,s.y,x,y),v=s.t.k==='honey'?5:7;if(d<v+4||s.tg.home){s.dead=1;if(s.t.splash){for(const o of crit){const q=pos(o);if(K.d(q[0],q[1],x,y)<s.t.splash){giggle(o,s.t.d*s.lv);o.slow=Math.max(o.slow,40)}}S.burst(x,y,6,['#ffb030','#ffe08a'],1.5)}else{giggle(s.tg,s.t.d*s.lv);if(s.t.slow)s.tg.slow=90}}else{s.x+=(x-s.x)/d*v;s.y+=(y-s.y)/d*v}}
   shots=shots.filter(s=>!s.dead);crit=crit.filter(o=>!o.gone&&!(o.home&&(o.s<=0||o.fade>1)));
   if(cookies<=0){S.fail('The critters got the cookies! Add more helpers 🍪');return}
   if(!spawnQ.length&&!crit.some(o=>!o.home)){wave++;acorns+=3;if(wave>=C.w){S.win(cookies>=5?3:cookies>=3?2:1);return}phase='break';cnt=480;S.sfx(880,.2,'triangle',.1);floaters.push({x:JX,y:JY-60,t:0,s:'Wave bonus +3 🌰'})}},
  down(x,y){dn={x,y}},move(){},
  up(x,y){if(!dn||S.done){dn=null;return}const m=K.d(x,y,dn.x,dn.y);dn=null;if(m<16)act(x,y)},
  bot(){if(f%10)return;const tap=(x,y)=>{G.down(x,y);G.up(x,y)};
   if(menu){const nb0=pads.filter(p=>p.t).length,want=menu.opts[menu.opts[0].up?0:[0,1,0,2][nb0%4]];const o=want&&want.cost<=acorns&&!(want.up&&menu.p.t.lv>=3)?want:menu.opts.find(o=>o.cost<=acorns&&(!o.up||menu.p.t.lv<3));if(o){tap(o.x,o.y);return}tap(5,600);return}
   const cov=(p,pt)=>pt.filter(q=>K.d(q[0],q[1],p.x,p.y)<75).length;const have=paths.map(pt=>pads.filter(q=>q.t).reduce((a,q)=>a+cov(q,pt),0));const score=p=>paths.reduce((a,pt,i)=>a+cov(p,pt)/(1+have[i]/25),0)-K.d(p.x,p.y,JX,JY)*.02;
   const free=pads.filter(p=>!p.t).sort((a,b)=>score(b)-score(a)),built=pads.filter(p=>p.t&&p.t.lv<3);const nb=pads.filter(p=>p.t).length;
   if(free.length&&(nb<4+lv||!built.length)&&acorns>=4){tap(free[0].x,free[0].y);return}
   const cu=built.sort((a,b)=>upCost(a.t)-upCost(b.t))[0];if(cu&&acorns>=upCost(cu.t)){tap(cu.x,cu.y);return}
   if(free.length&&acorns>=8){tap(free[0].x,free[0].y);return}
   if(phase==='break'&&f%60==0)tap(300,592)},
  tut(l){const p=pads&&pads[0];if(l===0)return{id:'a',text:'Critters want the 🍪 cookie jar! <b>Tap a round pad</b>, then pick a helper. Prices are in acorns 🌰 — count them! Helpers tickle critters until they giggle and go home.',path:p?[[p.x,p.y],[p.x,p.y<150?p.y+56:p.y-56]]:[[180,300]],dur:1800};
   if(l===3)return{id:'b',text:'Two paths now! Put helpers where both paths are close. <b>Tap a helper</b> to make it stronger.',path:[[180,300]],dur:1400}},
  draw(c){const g=c.createLinearGradient(0,0,0,620);g.addColorStop(0,C.bg[0]);g.addColorStop(1,C.bg[1]);c.fillStyle=g;c.fillRect(-200,-200,760,1020);
   for(let i=0;i<30;i++){c.globalAlpha=.35;S.emoji(['🌼','🌱','🍄','🌷','🪨'][i%5],(i*113)%360,(i*71+50)%600,13);c.globalAlpha=1}
   for(const p of paths){c.lineCap='round';c.lineJoin='round';for(const[w,col]of[[40,'#00000025'],[34,'#e8cf9a'],[26,'#f6e3b4']]){c.strokeStyle=col;c.lineWidth=w;c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[0],q[1]+(w===40?3:0)):c.moveTo(q[0],q[1]));c.stroke()}
    c.setLineDash([2,14]);c.strokeStyle='#c8a86a';c.lineWidth=4;c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.stroke();c.setLineDash([]);S.emoji('🕳️',p[0][0],p[0][1],26)}
   for(const p of pads){S.circ(p.x,p.y+3,24,'#0003');S.circ(p.x,p.y,24,menu&&menu.p===p?'#fff6b0':'#c8e8a0');c.strokeStyle='#fff';c.lineWidth=3;S.circ(p.x,p.y,24);c.stroke();
    if(!p.t){K.txt('+',p.x,p.y,20,'#5a8a3a')}else{const t=p.t;if(menu&&menu.p===p){c.setLineDash([5,6]);c.strokeStyle='#fff9';S.circ(p.x,p.y,t.def.rg+(t.lv-1)*10);c.stroke();c.setLineDash([])}
     K.blob(p.x,p.y,15,t.def.col,{glow:false,lx:Math.cos(t.face),ly:Math.sin(t.face)});S.emoji(t.def.ic,p.x+12,p.y-14,18);for(let k=0;k<t.lv;k++)K.star(p.x-8+k*8,p.y+21,4)}}
   // jar
   S.glow(JX,JY,60,'rgba(255,240,170,.5)');c.fillStyle='#d8f0ffcc';S.rr(JX-28,JY-30,56,58,14);c.fill();c.strokeStyle='#fff';c.lineWidth=3;c.stroke();c.fillStyle='#c0702a';S.rr(JX-22,JY-38,44,10,5);c.fill();
   for(let i=0;i<cookies;i++)S.emoji('🍪',JX-14+(i%3)*14,JY+14-Math.floor(i/3)*16,15);
   for(const o of crit){const[x,y]=pos(o);c.globalAlpha=o.home?Math.max(0,1-(o.fade||0)):1;const b=Math.sin(f*.25+o.wob)*2;
    K.blob(x,y-b,o.d.r,o.hit?'#fff':o.d.col,{ears:o.d.ears,glow:false,o:!o.home&&o.hit>0,lx:0,ly:1});if(o.slow>0&&!o.home){c.globalAlpha=.45;S.circ(x,y-b,o.d.r+5,'#bff')}c.globalAlpha=1;
    if(o.home)S.emoji('😄',x+o.d.r,y-o.d.r-6,12);else{const k=1-o.hp/o.mhp;c.fillStyle='#0006';c.fillRect(x-12,y+o.d.r+3,24,4);c.fillStyle='#ff9ad5';c.fillRect(x-12,y+o.d.r+3,24*k,4)}}
   for(const s of shots){if(s.t.k==='tickle')S.emoji('🪶',s.x,s.y,14,f*.3);else if(s.t.k==='bubble'){c.strokeStyle='#fff';c.lineWidth=2;S.circ(s.x,s.y,7,'#bff8');c.stroke()}else S.circ(s.x,s.y,6,'#ffb030')}
   for(const fl of floaters){c.globalAlpha=1-fl.t/50;K.txt(fl.s,fl.x,fl.y-fl.t*.6,14,'#fff6b0');c.globalAlpha=1}
   K.hud(C.n+' · Wave '+Math.min(wave+1,C.w)+'/'+C.w,20);
   c.fillStyle='#0006';S.rr(6,38,348,30,15);c.fill();K.txt('🌰 '+acorns,14,53,16,'#ffe9a0','left');acornRow(acorns,150,53,8,11);K.txt('🏠 '+home+' sent home',348,53,13,'#fff','right');
   if(phase==='break'){c.fillStyle='#ffd54a';S.circ(300,592,30);c.fill();c.strokeStyle='#fff';c.lineWidth=3;c.stroke();K.txt('GO ▶',300,586,15);K.txt(''+Math.ceil(cnt/60),300,604,11);
    K.txt(wave?'Wave cleared! Add or grow helpers':'Tap a pad ➕ to place helpers',180,84,13,'#fff')}
   if(menu){for(const o of menu.opts){const ok=o.cost<=acorns&&!(o.up&&menu.p.t.lv>=3);c.globalAlpha=ok?1:.6;S.circ(o.x,o.y+2,25,'#0005');S.circ(o.x,o.y,25,ok?'#fffbe0':'#ddd');c.strokeStyle=ok?'#ffb020':'#999';c.lineWidth=3;c.stroke();
     S.emoji(o.up?'⬆️':o.t.ic,o.x,o.y-6,20);if(o.up&&menu.p.t.lv>=3)K.txt('MAX',o.x,o.y+13,11);else{const n=o.cost;for(let k=0;k<n;k++)S.emoji('🌰',o.x-(Math.min(n,5)-1)*4.5+(k%5)*9,o.y+11+Math.floor(k/5)*8,9)}
     c.globalAlpha=1;K.txt((o.up?'Stronger':o.t.nm)+' '+o.cost,o.x,o.y-34,11,'#fff')}}}};
 return G})();

if(!G.keys&&G.goal)G.keys=lv=>{const g=G.goal();return[['goal',g.x,g.y,g.r*2,1]]};
window.T=Object.assign(window.T||{},{S,G,skipTut(){const s=S.ls.get('tut',{});for(let i=0;i<G.levels;i++){const t=G.tut&&G.tut(i);if(t)s[t.id]=1}S.ls.set('tut',s);document.getElementById("tutOk").click()}});
